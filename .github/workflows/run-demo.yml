name: Run Healthcare Data Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run data curation
        run: python scripts/curate.py

      - name: Display summary
        run: cat outputs/summary.json

      - name: Save downloadable results
        uses: actions/upload-artifact@v4
        with:
          name: healthcare-data-demo-results
          path: outputs/
          if-no-files-found: error
          retention-days: 7
